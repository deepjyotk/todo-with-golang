
version : '3.9'
services:
  todo-with-golang:
    build:
      context: .
      dockerfile: Dockerfile
    image: deepjyot/todo-with-golang
    container_name: todo_apps
    env_file:
      - deployments/docker/.env.docker
    depends_on:
      postgres:
        condition: service_healthy # this is IMP
    ports:
      - "8080:8080"
    networks:
      - app-network

  postgres:
    image: postgres:latest
    container_name: postgres
    env_file:
      - deployments/docker/.env.docker
    volumes:
      - "./data:/var/lib/postgresql/data"
      - "./deployments/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    env_file:
      - deployments/docker/.env.docker
    depends_on:
      - postgres
    ports:
      - "5050:80"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge